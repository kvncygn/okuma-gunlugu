name: okuma_gunlugu
description: Okuma Günlüğü - Kişisel kitap takip, okuma seansı, OCR alıntı ve keşif uygulaması.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Data Models & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI, Fonts & Icons
  google_fonts: ^6.2.1
  # Firebase (Offline Persistence + Auth)
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # OCR, Media & Sharing
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2
  share_plus: ^10.0.0
  gal: ^2.3.0

  # Storage, Networking & Utilities
  shared_preferences: ^2.3.1
  http: ^1.2.2
  intl: any
  uuid: ^4.4.2
  path_provider: ^2.1.4
  lucide_icons_flutter: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
